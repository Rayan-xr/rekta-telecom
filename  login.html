<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - REKTA TELECOM</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#0b1020;
  color:white;
}

header{
  padding:25px;
  text-align:center;
  background:linear-gradient(135deg,#6c2cff,#00c6ff);
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#151d35;
  padding:25px;
  border-radius:20px;
  border:1px solid #293557;
}

input,
textarea{
  width:100%;
  padding:14px;
  margin:8px 0 15px;
  background:#0b1020;
  border:1px solid #354269;
  color:white;
  border-radius:10px;
}

textarea{
  height:120px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#6c2cff,#00c6ff);
  color:white;
  font-size:17px;
  font-weight:bold;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  display:none;
  margin:10px 0;
  border-radius:15px;
}
</style>
</head>

<body>

<header>
  <h1>🔐 REKTA-TELECOM</h1>
  <p>لوحة إدارة المنتجات</p>
</header>

<div class="container">

<div class="card">

<h2>➕ إضافة هاتف</h2>

<label>📷 صورة الهاتف</label>

<input
  type="file"
  id="image"
  accept="image/*"
  onchange="previewImage()">

<img id="preview" class="preview">

<label>📱 اسم الهاتف</label>

<input
  id="name"
  type="text"
  placeholder="مثال: iPhone 15">

<label>💰 السعر</label>

<input
  id="price"
  type="text"
  placeholder="مثال: 120000 دج">

<label>💾 RAM</label>

<input
  id="ram"
  type="text"
  placeholder="مثال: 8GB">

<label>💽 التخزين</label>

<input
  id="storage"
  type="text"
  placeholder="مثال: 256GB">

<label>📝 المواصفات</label>

<textarea
  id="specs"
  placeholder="اكتب مواصفات الهاتف هنا"></textarea>

<button onclick="addProduct()">
  نشر المنتج
</button>

</div>

</div>

<script>

function previewImage(){

  const file =
    document.getElementById("image").files[0];

  if(!file) return;

  const preview =
    document.getElementById("preview");

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";
}


function addProduct(){

  const name =
    document.getElementById("name").value;

  if(name === ""){

    alert("اكتب اسم الهاتف");

    return;
  }

  alert(
    "تم تجهيز المنتج: " + name +
    "\nسنربطه بقاعدة البيانات في الخطوة القادمة."
  );

}

</script>

</body>
</html>
